<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f6">
  <meta name="color-scheme" content="light dark">
  <title>Eye Exercises</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Home -->
    <section id="screen-home" class="screen active" aria-label="Home">
      <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg id="icon-moon" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="icon-sun" class="ico" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>

      <div class="home-content">
        <div class="logo" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <h1 class="title">Eye Exercises</h1>
        <p class="subtitle">A few gentle minutes to relax and refresh your eyes.</p>
        <button id="play-btn" class="play-btn" type="button" aria-label="Start eye exercises">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 7 5.2z"/></svg>
          <span>Start</span>
        </button>
      </div>
    </section>

    <!-- Get ready interstitial -->
    <section id="screen-ready" class="screen" aria-label="Get ready">
      <div class="bar">
        <button class="icon-btn" type="button" data-quit aria-label="Quit and return to home">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <span id="ready-step" class="step"></span>
      </div>
      <div class="ready-content">
        <p class="eyebrow">Get ready</p>
        <h2 id="ready-title" tabindex="-1"></h2>
        <p id="ready-instruction" class="instruction"></p>
        <div id="ready-count" class="countdown" aria-live="polite">3</div>
      </div>
    </section>

    <!-- Exercise session -->
    <section id="screen-session" class="screen" aria-label="Exercise">
      <div class="session">
        <header class="session-head">
          <div class="bar">
            <button class="icon-btn" type="button" data-quit aria-label="Quit and return to home">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <h2 id="session-title" class="session-title" tabindex="-1"></h2>
            <span id="session-step" class="step"></span>
          </div>
          <p id="session-instruction" class="instruction"></p>
          <div id="session-progress" class="progress" role="progressbar" aria-label="Exercise progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </header>
        <div id="stage" class="stage"></div>
      </div>
    </section>

    <!-- Congratulations -->
    <section id="screen-congrats" class="screen" aria-label="Congratulations">
      <div class="center-content">
        <div class="badge" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h2 id="congrats-title" class="congrats-title" tabindex="-1">Well done!</h2>
        <p id="congrats-msg" class="subtitle">You finished all the exercises. Your eyes thank you for the break.</p>
        <div class="tip">
          <p class="eyebrow">Eye-care tip</p>
          <p>Try the 20-20-20 rule: every 20 minutes, look at something about 20 feet (6 metres) away for at least 20 seconds.</p>
        </div>
        <button id="home-btn" class="btn" type="button">Back to home</button>
      </div>
    </section>

  </div>

  <!-- Exercises (plugin contract: each pushes into window.EyeExercises) -->
  <script src="js/exercises/blink.js"></script>
  <script src="js/exercises/palming.js"></script>
  <script src="js/exercises/horizontal.js"></script>
  <script src="js/exercises/vertical.js"></script>
  <script src="js/exercises/follow-dot.js"></script>
  <script src="js/exercises/figure-eight.js"></script>
  <script src="js/exercises/circles.js"></script>
  <script src="js/exercises/near-far.js"></script>

  <!-- App shell -->
  <script src="js/app.js"></script>
</body>
</html>
